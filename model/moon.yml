language: "rust"
layer: "library"

project:
  title: "Model"
  description: "The forecasting model: field draws, poll aggregation, two-round Monte Carlo. Pure computation."

tasks:
  test:
    description: "Run the model's tests."
    command: "cargo"
    args: ["test", "--locked", "-p", "fr2027-model"]
    inputs: ["Cargo.toml", "src/**/*", "/Cargo.lock", "/rust-toolchain.toml"]
    toolchains: ["rust"]

  clippy:
    description: "Lint the model with clippy, warnings as errors."
    command: "cargo"
    args: ["clippy", "--locked", "-p", "fr2027-model", "--all-targets", "--", "-D", "warnings"]
    inputs: ["Cargo.toml", "src/**/*", "/Cargo.lock", "/rust-toolchain.toml"]
    toolchains: ["rust"]

  format:
    description: "Format the model's Rust sources."
    command: "cargo"
    args: ["fmt", "-p", "fr2027-model"]
    options:
      cache: false
      runInCI: false
    toolchains: ["rust"]

  format-check:
    description: "Fail when the model's Rust sources are not formatted."
    command: "cargo"
    args: ["fmt", "-p", "fr2027-model", "--check"]
    inputs: ["src/**/*", "/rustfmt.toml"]
    toolchains: ["rust"]
