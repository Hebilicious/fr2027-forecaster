name: Land

# Lands the Claude editor routine's work (docs/editor.md) on main without a person: polls it
# checked against their notices, and the field changes its sources confirm. The routine pushes a
# claude/editor-* branch; this workflow accepts only the paths the editor may touch, rebuilds the
# clean files, runs every check, fast-forwards main, and starts the Live workflow (refit and
# publish). It pushes with GITHUB_TOKEN, whose pushes start no workflow; a workflow_dispatch is
# the one event that token may send, so Live is started explicitly. CI is not re-run on main:
# this workflow already ran `moon ci` on the exact commit it lands.
on:
  push:
    branches: ["claude/editor-**"]

permissions:
  contents: read

concurrency:
  group: land
  cancel-in-progress: false

jobs:
  land:
    name: Check and land on main
    if: github.repository == 'Hebilicious/fr2027-forecaster'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # push to main, delete the branch
      actions: write # start Live
    env:
      FR2027: ./target/release/fr2027
      BRANCH: ${{ github.ref_name }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      # Actions are pinned to full commit SHAs; the tag is in the comment.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # The editor adds poll files and edits the field, the research log and the README's counts.
      # Anything else, and any change to an existing raw file, needs a person.
      - name: Check the paths
        run: |
          git fetch -q origin main
          bad=$(git diff --name-status "$(git merge-base origin/main HEAD)" HEAD | awk '
            $1 == "A" && $2 ~ /^data\/raw\/polls\/[a-z0-9-]+\.yaml$/ { next }
            $1 ~ /^[AM]$/ && $2 ~ /^research\/sources\// { next }
            $1 == "M" && ($2 == "config/candidates.yaml" || $2 == "research/LOG.md" || $2 == "README.md") { next }
            { print }')
          if [ -n "$bad" ]; then
            echo "::error::the editor may not change these paths; leaving $BRANCH for a person:"; echo "$bad"; exit 1
          fi

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      # On the hosted runner, proto's Rust install leaves rustup with a toolchain that holds clippy
      # and rustfmt but no rustc or cargo (seen 2026-10-09). Reinstall it from rust-toolchain.toml
      # whenever any of the four tools is missing; otherwise this only checks.
      - name: Check the Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          complete() {
            rustup run "$channel" rustc --version && rustup run "$channel" cargo --version &&
              rustup run "$channel" cargo clippy --version && rustup run "$channel" rustfmt --version
          }
          if ! complete; then
            rustup toolchain uninstall "$channel" || true
            rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt --no-self-update
            complete
          fi
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ci-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            cargo-ci-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Rebase on main and rebuild the clean files
        run: |
          git rebase -q origin/main
          moon run cli:build
          $FR2027 ingest
          git add -A -- data/clean
          git diff --cached --quiet || git commit -q -m "chore(data): clean files for $BRANCH"

      - name: Run every check
        run: moon ci --base origin/main --head HEAD

      - name: Land on main and start Live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              git push -q origin --delete "$BRANCH"
              gh workflow run live.yml --ref main
              echo "Landed $BRANCH on main and started Live."; exit 0
            fi
            # Live commits data to main every hour. Raw files never conflict; clean files are
            # rebuilt from raw.
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              git checkout -q origin/main -- data/clean data/forecasts
              $FR2027 ingest
              git add -A -- data
              GIT_EDITOR=true git rebase --continue
            fi
            $FR2027 validate
          done
          exit 1
