name: Backtest signals

# Fetches a past election's page views or news volume (`fr2027 backtest-signals`), or the live
# news volume since 1 August 2026 (`fr2027 collect gdelt --backfill`), on GitHub runners, and
# uploads one merged artifact per target, to be committed by hand into data/backtest/<year>/ or
# data/raw/gdelt/. The news volume reads every one of GDELT's raw files, 96 a day: about 35,000
# a year, 400 to 900 GB, each downloaded, read for its French records and dropped. Each target is
# cut into 32 runs of days, one runner each.
#
# Run it from the Actions tab, or push a branch named backtest-signals/<year or live> to fetch
# that target's news volume, or backtest-signals/<anything else> for every election and live.

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Election year, as in config/backtest.yaml, or live"
        required: true
        type: string
      source:
        description: "attention, news, or both"
        required: true
        default: news
        type: choice
        options: [news, attention, both]
  push:
    branches: ["backtest-signals/**"]

permissions:
  contents: read

jobs:
  # The targets to fetch: the one given by hand; on a push, the year (or live) a branch named
  # backtest-signals/<target> ends with, or every election with signals and live.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}
      targets: ${{ steps.chunks.outputs.targets }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Each target's window cut into 32 runs of days, one runner each: a year of GDELT files is
      # 400 to 900 GB. An election's window is in data/backtest/<year>/signals.yaml; live runs
      # from 1 August 2026 to yesterday.
      - id: chunks
        env:
          INPUT_YEAR: ${{ inputs.year }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_YEAR" ]; then
            targets="$INPUT_YEAR"
          elif [[ "$BRANCH" =~ /([0-9]{4}|live)$ ]]; then
            targets="${BASH_REMATCH[1]}"
          else
            # Only the elections that have signals: data/backtest/<year>/signals.yaml.
            years=$(sed -n 's/^  - { year: \([0-9]\{4\}\),.*/\1/p' config/backtest.yaml | while read -r y; do
              [ -f "data/backtest/$y/signals.yaml" ] && echo "$y"
            done | paste -sd' ' -)
            targets="$years live"
          fi
          chunks="[]"
          for y in $targets; do
            if [ "$y" = live ]; then
              start=2026-08-01; end=$(date -ud yesterday +%F)
            else
              [[ "$y" =~ ^[0-9]{4}$ ]] || { echo "::error::bad target $y"; exit 1; }
              file="data/backtest/$y/signals.yaml"
              start=$(sed -n 's/^start: //p' "$file"); end=$(sed -n 's/^end: //p' "$file")
            fi
            days=$(( ($(date -ud "$end" +%s) - $(date -ud "$start" +%s)) / 86400 + 1 ))
            size=$(( (days + 31) / 32 ))
            for i in $(seq 0 31); do
              from=$(date -ud "$start + $((i * size)) days" +%F)
              to=$(date -ud "$start + $((i * size + size - 1)) days" +%F)
              [[ "$from" > "$end" ]] && break
              [[ "$to" > "$end" ]] && to=$end
              chunks=$(jq -c --arg y "$y" --arg f "$from" --arg t "$to" '. + [{year: $y, start: $f, end: $t}]' <<<"$chunks")
            done
          done
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          echo "targets=$(jq -cn --arg t "$targets" '$t | split(" ")')" >> "$GITHUB_OUTPUT"

  fetch:
    name: fetch ${{ matrix.year }} ${{ matrix.start }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      # Actions are pinned to full commit SHAs; the tag is in the comment.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      # The runner image's rustup may hold the pinned channel without cargo; reinstall it then.
      - name: Check the Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          complete() { rustup run "$channel" rustc --version && rustup run "$channel" cargo --version; }
          if ! complete; then
            rustup toolchain uninstall "$channel" || true
            rustup toolchain install "$channel" --profile minimal --no-self-update
            complete
          fi
      - name: Build
        run: moon run cli:build
      - name: Fetch
        env:
          YEAR: ${{ matrix.year }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          SOURCE: ${{ inputs.source || 'news' }}
        run: |
          mkdir -p out
          if [ "$YEAR" = live ]; then
            target/release/fr2027 collect gdelt --backfill --start "$START" --end "$END"
            # The one raw file this run wrote, beside those already in the repository.
            git ls-files --others --exclude-standard data/raw/gdelt | xargs -I{} cp {} out/live.json
            exit 0
          fi
          [[ "$YEAR" =~ ^[0-9]{4}$ ]] || { echo "::error::year must be YYYY or live"; exit 1; }
          case "$SOURCE" in
            news | attention) only=(--only "$SOURCE") ;;
            both) only=() ;;
            *) echo "::error::unknown source $SOURCE"; exit 1 ;;
          esac
          target/release/fr2027 backtest-signals "$YEAR" "${only[@]}" --start "$START" --end "$END"
          for f in gdelt.csv attention.csv; do
            if [ -n "$(git status --porcelain "data/backtest/$YEAR/$f")" ]; then cp "data/backtest/$YEAR/$f" "out/$f"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backtest-signals-${{ matrix.year }}-${{ matrix.start }}
          path: out/
          if-no-files-found: error

  # One artifact per target: an election's CSV pieces concatenated in date order, or the live
  # pieces' days joined into one raw file, data/raw/gdelt/<today>-backfill.json.
  merge:
    needs: [plan, fetch]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backtest-signals-${{ matrix.target }}-*
          path: pieces
      - env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p merged
          pieces=$(ls -d pieces/*/ | sort)
          if [ "$TARGET" = live ]; then
            jq -s '
              .[0] + {
                start: (map(.start) | min), end: (map(.end) | max),
                candidates: [.[0].candidates[] as $c | $c + {days: [.[] as $p | $p.candidates[] | select(.candidate_id == $c.candidate_id) | .days[]] | sort_by(.date)}]
              }' $(for p in $pieces; do echo "$p/live.json"; done) > merged.json
            # Named after the fetch date it records, as the ingest checks.
            mv merged.json "merged/$(jq -r '.fetched_at[:10]' merged.json)-backfill.json"
            exit 0
          fi
          for f in gdelt.csv attention.csv; do
            first=$(for p in $pieces; do [ -f "$p/$f" ] && echo "$p/$f"; done | head -1)
            [ -z "$first" ] && continue
            head -1 "$first" > "merged/$f"
            for p in $pieces; do [ -f "$p/$f" ] && tail -n +2 "$p/$f" >> "merged/$f"; done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-${{ matrix.target }}
          path: merged/
          if-no-files-found: error
