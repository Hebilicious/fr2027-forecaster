name: Live

# Every hour: snapshot the prediction markets, record new headlines, record Wikipedia page views
# (once a day), bring in what Grok Bot posted to the inbox, refit the forecast when its inputs
# changed, commit the new data to main, and publish the public site to Cloudflare.
# From the inbox: X drops and events are committed; polls are proposed in a pull request and
# committed when a blind poll_check from another Grok Bot run matches them; field changes are
# applied to config/candidates.yaml and logged in research/LOG.md (docs/grok-bot.md).
# It also runs on every merge to main, so the page follows main. Its own data commits are pushed
# with GITHUB_TOKEN, which starts no workflow, so they don't start it again.
on:
  # The hourly clock is the Worker's cron trigger (app/worker, "17 * * * *"), which sends this
  # repository_dispatch with a token of the heb-release App. GitHub never fired this workflow's
  # hourly schedule (2026-10-16: no run from 04:17 to 08:17 UTC, through a re-push and a
  # disable/enable), so the schedule below is only a backup, every 6 hours.
  repository_dispatch:
    types: [live-hourly]
  schedule:
    - cron: "47 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      attention_start:
        description: "Backfill Wikipedia page views from this date (YYYY-MM-DD). Empty: the usual last week."
        required: false
        default: ""
      sync_worker_secrets:
        description: "Copy INBOX_BOT_TOKEN, INBOX_PIPELINE_TOKEN and the heb-release App key from the repository secrets to the Worker."
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, never cancelled half-way: each run commits to main.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  update:
    name: Collect, refit, publish
    if: github.repository == 'Hebilicious/fr2027-forecaster' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # commit data to main; push poll-proposal branches
      pull-requests: write # open, comment on and close the poll-proposal pull requests
    env:
      FR2027: ./target/release/fr2027
      HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      # Actions are pinned to full commit SHAs; the tag is in the comment.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 20
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      # On the hosted runner, proto's Rust install leaves rustup with a toolchain that holds clippy
      # and rustfmt but no rustc or cargo (seen 2026-10-09). Reinstall it from rust-toolchain.toml
      # whenever any of the four tools is missing; otherwise this only checks.
      - name: Check the Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          complete() {
            rustup run "$channel" rustc --version && rustup run "$channel" cargo --version &&
              rustup run "$channel" cargo clippy --version && rustup run "$channel" rustfmt --version
          }
          if ! complete; then
            rustup toolchain uninstall "$channel" || true
            rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt --no-self-update
            complete
          fi
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-live-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            cargo-live-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      # Moon's cache holds the outputs of cli:build and web:build by the hash of their inputs, so a
      # run whose Rust and web sources match an earlier run's restores the binary and dist/ instead
      # of building them. Without it cargo recompiles the workspace crates every run (~30 s): a
      # fresh checkout's file times don't match the cached target/. The key changes only with the
      # sources; restore-keys bring the newest cache when they changed.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .moon/cache
          key: moon-live-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.prototools', 'app/web/**', 'pnpm-lock.yaml', '!target/**', '!**/node_modules/**') }}
          restore-keys: |
            moon-live-

      - name: Build
        run: moon run cli:build web:build

      # A failing source is recorded in its file and warned about; it never stops the others.
      - name: Collect market prices
        run: $FR2027 collect markets || echo "::warning title=markets::collector failed, see the log"

      - name: Collect headlines
        run: $FR2027 collect news || echo "::warning title=news::collector failed, see the log"

      - name: Collect Wikipedia page views
        env:
          START: ${{ inputs.attention_start }}
        run: |
          if [ -n "$START" ]; then
            [[ "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::attention_start must be YYYY-MM-DD"; exit 1; }
            $FR2027 collect attention --start "$START" || echo "::warning title=attention::collector failed, see the log"
          elif [ "$(date -u +%H)" -ge 6 ]; then
            # Wikimedia publishes a day's views a few hours after midnight UTC.
            $FR2027 collect attention || echo "::warning title=attention::collector failed, see the log"
          fi

      # Once a day, like the page views: every GDELT file of the last three days, then the articles
      # whose headline names a candidate, read by Jev; a few minutes.
      - name: Collect news volume (GDELT)
        # Jev reads each matched article for how it portrays the candidates it names.
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ "$(date -u +%H)" -ge 6 ]; then
            $FR2027 collect gdelt || echo "::warning title=gdelt::collector failed, see the log"
          fi

      # The open proposals the inbox's poll checks are compared with: each inbox/polls-* pull
      # request's poll files and their sidecars (the inbox item that sent each poll), in
      # .inbox/open/<number>/.
      - name: Gather the open poll proposals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .inbox/open && mkdir -p .inbox/open
          gh pr list --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("inbox/polls-")) | "\(.number) \(.headRefName)"' |
            while read -r number branch; do
              if ! git fetch -q --depth=1 origin "refs/heads/$branch" </dev/null; then
                echo "::warning title=proposals::could not fetch $branch"; continue
              fi
              mkdir -p ".inbox/open/$number"
              gh pr view "$number" --json files \
                --jq '.files[].path | select(test("^data/(raw|proposals)/polls/[a-z0-9-]+[.](yaml|json)$"))' </dev/null |
                while read -r path; do git show "FETCH_HEAD:$path" > ".inbox/open/$number/${path##*/}"; done
              echo "#$number ($branch): $(ls ".inbox/open/$number" | paste -sd' ' -)"
            done

      - name: Pull the Grok Bot inbox
        env:
          FR2027_INBOX_URL: ${{ vars.FR2027_INBOX_URL }}
          INBOX_PIPELINE_TOKEN: ${{ secrets.INBOX_PIPELINE_TOKEN }}
        run: |
          if [ -z "$FR2027_INBOX_URL" ] || [ -z "$INBOX_PIPELINE_TOKEN" ]; then
            echo "Inbox not configured (variable FR2027_INBOX_URL, secret INBOX_PIPELINE_TOKEN); skipping."
            exit 0
          fi
          $FR2027 inbox pull || echo "::warning title=inbox::pull failed; the items stay pending"
          # A field change rewrites only its own blocks; the formatter keeps the files as CI checks them.
          if [ "$(jq length .inbox/field-changes.json 2>/dev/null || echo 0)" -gt 0 ]; then
            pnpm exec oxfmt config/candidates.yaml config/sources.yaml research/LOG.md ||
              echo "::warning title=format::oxfmt failed; the field change is committed unformatted"
          fi

      - name: Ingest, refit, validate
        run: |
          $FR2027 ingest
          $FR2027 forward || echo "::warning title=forward::the forward log failed, see the log"
          $FR2027 forecast --if-changed
          $FR2027 validate

      # Only data/, plus the field files when the inbox applied a field change in this run.
      - name: Commit data to main
        id: commit
        run: |
          field_files=(config/candidates.yaml config/sources.yaml research/LOG.md)
          changes=$(jq -r 'join(", ")' .inbox/field-changes.json 2>/dev/null || true)
          allowed=(':(exclude)data')
          if [ -n "$changes" ]; then
            for f in "${field_files[@]}"; do allowed+=(":(exclude)$f"); done
          fi
          stray=$(git status --porcelain --untracked-files=all -- . "${allowed[@]}")
          if [ -n "$stray" ]; then
            echo "::error::files outside data/ changed, and no field change from the inbox explains them:"; echo "$stray"; exit 1
          fi
          git add -A -- data
          if [ -n "$changes" ]; then git add -- "${field_files[@]}"; fi
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          areas=$(git diff --cached --name-only | awk -F/ '$2 == "raw" { print $3 } $2 == "forecasts" { print "forecast" } $2 == "forward" { print "forward" }' | sort -u | paste -sd, -)
          message="chore(data): ${areas:-clean files} $(date -u +%Y-%m-%dT%H)Z"
          if [ -n "$changes" ]; then message="$message; field: $changes (Grok Bot field_change)"; fi
          git commit -q -m "$message"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              # Raw files are new, or an event only this run links to a new candidate, and never
              # conflict; only derived files can. Take main's, rebuild them from raw, and carry on.
              git checkout -q origin/main -- data/clean data/forecasts
              $FR2027 ingest
              git add -A -- data
              GIT_EDITOR=true git rebase --continue
            fi
            $FR2027 validate
          done
          exit 1

      # A pull request opened with GITHUB_TOKEN starts no CI, so the poll proposals, their comments
      # and their closing use a token of the heb-release App when its key is set (docs/operations.md).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: ${{ env.HAS_APP_KEY == 'true' }}
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Each pull request lists, per poll, where to read it and none of its numbers, so that Grok
      # Bot's checking routine can enter it blind. The sidecars (data/proposals/polls/*.json,
      # ignored on main) carry the inbox item that a check settles.
      - name: Propose polls from the inbox
        id: proposals
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          shopt -s nullglob
          files=(data/proposals/polls/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          branch="inbox/polls-${GITHUB_RUN_ID}"
          git switch -q -c "$branch"
          ids=""
          rows=""
          for f in "${files[@]}"; do
            ids="$ids $(basename "$f" .yaml)"
            rows="$rows$(jq -r '"| `\(.poll_id)` | \(.source_url) | \(.notice_url // "none") | \(.supersedes // "none") | `\(.entered_by_run)` |"' "${f%.yaml}.json")"$'\n'
            mv "$f" data/raw/polls/
          done
          ids="${ids# }"
          $FR2027 ingest
          $FR2027 validate
          git add -A -- data/raw/polls data/clean
          git add -f -- data/proposals/polls/*.json
          git commit -q -m "chore(polls): ${ids} (from Grok Bot, waiting for a blind check)"
          git push -q origin "$branch"
          body="Grok Bot sent these polls to the inbox. Each passed the schema, candidate and sum checks in the Live run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          body="$body"$'\n\n'"| poll_id | source_url | notice_url | supersedes | entered by run |"
          body="$body"$'\n'"| --- | --- | --- | --- | --- |"
          body="$body"$'\n'"${rows}"
          body="$body"$'\n'"Grok Bot's routine 4 (docs/grok-bot.md) enters each poll again from its notice or publication, without reading the numbers in this pull request, and sends it as a poll_check. When a check from another routine run agrees with a file on poll_id, supersedes, fieldwork dates, sample size and every share, the Live workflow commits that file to main unchanged and says so here. When it differs, Live lists every difference here and the pull request stays open for another check. It is closed once every poll in it is on main or replaced by a newer proposal. Don't merge it by hand: data/proposals/ holds the inbox's bookkeeping."
          if url=$(gh pr create --base main --head "$branch" --title "Polls from Grok Bot: ${ids}" --body "$body"); then
            echo "ref=$url" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=proposals::could not open a pull request (allow it in Settings → Actions → General → Workflow permissions); branch $branch is pushed"
            echo "ref=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}" >> "$GITHUB_OUTPUT"
          fi
          git switch -q main

      # What the poll checks decided about the open proposals (.inbox/pr-actions.json, written by
      # the pull): a comment with every difference, or that a file landed (posted only once this
      # run's commit is on main), and closing the pull requests whose every poll is on main or
      # replaced.
      - name: Comment on and close poll proposals
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ ! -s .inbox/pr-actions.json ]; then exit 0; fi
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}"
          jq -c '.[]' .inbox/pr-actions.json | while read -r action; do
            number=$(jq -r .number <<<"$action")
            if [ "$(jq -r .needs_commit <<<"$action")" = true ] && [ -z "$SHA" ]; then
              echo "::warning title=proposals::#$number: this run's commit is not on main; the next run decides again"
              continue
            fi
            jq -r .comment <<<"$action" | sed "s#{commit}#${commit_url}#g" > "$RUNNER_TEMP/comment.md"
            gh pr comment "$number" --body-file "$RUNNER_TEMP/comment.md" </dev/null
            if [ "$(jq -r .close <<<"$action")" = true ]; then
              gh pr close "$number" --delete-branch </dev/null
            fi
          done

      - name: Resolve inbox items
        env:
          FR2027_INBOX_URL: ${{ vars.FR2027_INBOX_URL }}
          INBOX_PIPELINE_TOKEN: ${{ secrets.INBOX_PIPELINE_TOKEN }}
          PROPOSAL_REF: ${{ steps.proposals.outputs.ref }}
        run: |
          if [ ! -f .inbox/resolutions.json ]; then exit 0; fi
          if [ -n "$PROPOSAL_REF" ]; then
            $FR2027 inbox resolve --proposal-ref "$PROPOSAL_REF"
          else
            $FR2027 inbox resolve
          fi

      # Publishes whatever was committed, even when proposing polls or resolving the inbox failed.
      - name: Publish the site to Cloudflare
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; not deploying."
            exit 0
          fi
          git checkout -q -f main
          set +e; $FR2027 export; code=$?; set -e
          if [ "$code" -eq 3 ]; then echo "::notice::Publication blackout: the site keeps its last version."; exit 0; fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          cd app/worker && pnpm exec wrangler deploy

      # The inbox tokens, and the heb-release App's key for the Worker's hourly dispatch. GitHub
      # hands out PKCS#1 keys; WebCrypto in the Worker needs PKCS#8.
      - name: Copy the inbox tokens and the App key to the Worker
        if: ${{ !cancelled() && inputs.sync_worker_secrets }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INBOX_BOT_TOKEN: ${{ secrets.INBOX_BOT_TOKEN }}
          INBOX_PIPELINE_TOKEN: ${{ secrets.INBOX_PIPELINE_TOKEN }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$INBOX_BOT_TOKEN" ] || [ -z "$INBOX_PIPELINE_TOKEN" ]; then
            echo "::error::set the INBOX_BOT_TOKEN and INBOX_PIPELINE_TOKEN repository secrets first"; exit 1
          fi
          if [ -n "$RELEASE_APP_PRIVATE_KEY" ]; then
            GITHUB_APP_PRIVATE_KEY=$(printf '%s\n' "$RELEASE_APP_PRIVATE_KEY" | openssl pkcs8 -topk8 -nocrypt)
          else
            echo "::warning::RELEASE_APP_PRIVATE_KEY is not set; the Worker's hourly dispatch stays off"
            GITHUB_APP_PRIVATE_KEY=""
          fi
          export GITHUB_APP_PRIVATE_KEY
          file="$RUNNER_TEMP/worker-secrets.json"
          jq -n '{INBOX_BOT_TOKEN: env.INBOX_BOT_TOKEN, INBOX_PIPELINE_TOKEN: env.INBOX_PIPELINE_TOKEN}
            + (if env.GITHUB_APP_PRIVATE_KEY != "" then {GITHUB_APP_PRIVATE_KEY: env.GITHUB_APP_PRIVATE_KEY} else {} end)' > "$file"
          (cd app/worker && pnpm exec wrangler secret bulk "$file")
          rm -f "$file"
