name: Clock

# Starts the Live workflow about once an hour. GitHub never fired Live's own hourly schedule
# (16 October 2026), so this separate workflow ticks every 20 minutes and starts Live only when no
# Live run began in the last 50 minutes; GitHub drops or delays some scheduled ticks, and the
# Worker's cron (app/worker) may also start Live, so the check keeps it to one run an hour.
# GITHUB_TOKEN may send a workflow_dispatch, the one event of its own that starts a run.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    name: Start Live if it is due
    if: github.repository == 'Hebilicious/fr2027-forecaster'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start Live
        run: |
          last=$(gh run list --workflow live.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$age" -lt 3000 ]; then
            echo "Live started $((age / 60)) minutes ago; nothing to do."; exit 0
          fi
          gh workflow run live.yml --ref main
          echo "Started Live (the last run began $((age / 60)) minutes ago)."
