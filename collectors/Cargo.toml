[package]
name = "fr2027-collectors"
version = "0.1.0"
description = "Reads, validates and cleans everything sources write into the repository."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
csv = "1.4.0"
fr2027-model.workspace = true
hex = "0.4.3"
jiff = { version = "0.2.38", features = ["serde"] }
jsonschema = { version = "0.58.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3"
