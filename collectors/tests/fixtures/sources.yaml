# French law bans publishing, broadcasting or commenting on any poll on the eve and the day of each
# round (loi n° 77-808 du 19 juillet 1977, art. 11). The page is public, so `fr2027 export`
# refuses to build it inside these windows (Paris summer time, UTC+2) and the hourly deploy keeps the last
# page from before. Collection and the model keep running.
publication_blackouts:
  - { from: "2027-04-17T00:00:00+02:00", until: "2027-04-18T20:00:00+02:00" }
  - { from: "2027-05-01T00:00:00+02:00", until: "2027-05-02T20:00:00+02:00" }
