[package]
name = "fr2027-fetch"
version = "0.1.0"
description = "Reads the outside world: prediction markets, news feeds, Wikipedia page views, and the agent inbox."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
encoding_rs = "0.8.42"
feed-rs = "3.0.0"
fr2027-collectors.workspace = true
jiff = { version = "0.2.38", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["blocking", "json", "gzip"] }
scraper = "0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
