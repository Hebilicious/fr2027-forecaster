notes: "Supersedes opinionway-2026-10-14-cnews (entered from the JDD's reproduction of OpinionWay's chart before the notice was filed). Notice 10319, filed 15 October 2026: 978 registered drawn from 1,043; online (CAWI), 13–14 October. Every share of the round 1 scenario and the three runoffs matches the notice's 'Publié' column and the earlier file. The notice states that the published column is computed on registered voters certain to vote (9–10 out of 10, 731 respondents), so population is likely. Bouamrane '<1%' is entered as 0.5. The questionnaire lists François Hollande among the round 1 options, but the results table has no row for him; he is not entered. published_at kept from the earlier file (the JDD article of 15 October)."
