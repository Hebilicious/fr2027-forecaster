notes: "Supersedes opinionway-2026-10-14-les-echos (entered from OpinionWay's Présitrack wave 3 report before the notice was filed). Notice 10318, filed 15 October 2026: online (CAWI), 13–14 October. The notice states that the published column is computed on registered voters certain to vote (9–10 out of 10, 731 respondents), so population is likely. The notice's methodology page says 978 registered 'issu d'un échantillon de 1001 personnes', while its weighting tables and OpinionWay's report give 1,043; 1,043 is kept. Every share of the three scenarios matches the notice's 'Publié' column and the report, with one exception: in the notice's scenario 1 table the Le Pen row reads 4% and the Zemmour row 35%, the reverse of OpinionWay's report and of the notice's own scenarios 2 and 3; the report's values (Le Pen 35, Zemmour 4) are kept. Arthaud '<1%' in S1 is entered as 0.5. No runoff voting intentions are published."
