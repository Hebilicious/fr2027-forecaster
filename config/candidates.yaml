slots:
  - id: rn
    label: "Rassemblement national nominee"
    rationale: "Le Pen is eligible after the 7 July 2026 appeal ruling and declared that evening; Bardella backs her. Residual risk is her own cassation appeal (ruling 'at the latest early April 2027'). Probabilities follow Polymarket's 'who will be on the ballot' market on 2026-10-09 (Le Pen 0.91, Bardella 0.07)."
    options:
      - { run: [le_pen], p: 0.91 }
      - { run: [bardella], p: 0.07 }
  - id: zemmour
    rationale: "Declared 17 September 2026; on the ballot in 2022."
    options:
      - { run: [zemmour], p: 0.85 }
  - id: dupont_aignan
    rationale: "Declared 19 September 2026; on the ballot in 2012, 2017 and 2022."
    options:
      - { run: [dupont_aignan], p: 0.6 }
  - id: philippot
    rationale: "Declared 9 May 2026 but offered to step aside for a more unifying sovereigntist; never on a presidential ballot."
    options:
      - { run: [philippot], p: 0.2 }
  - id: asselineau
    rationale: "Declared and seeking the 500 sponsorships, which he reached in 2017 but not 2022."
    options:
      - { run: [asselineau], p: 0.25 }
  - id: bonnal
    rationale: "Self-declared; known only from a poll he commissioned."
    options:
      - { run: [bonnal], p: 0.02 }
  - id: retailleau
    label: "Les Républicains nominee"
    rationale: "Designated by LR members on 19 April 2026 (no primary); under pressure to step aside for Philippe. Polymarket's ballot market: 0.57."
    options:
      - { run: [retailleau], p: 0.6 }
  - id: lisnard
    rationale: "Declared 31 March 2026 and left LR; polls 2–5%. His Polymarket winner price (0.13) is treated as noise, not evidence."
    options:
      - { run: [lisnard], p: 0.4 }
  - id: bertrand
    rationale: "Said on 27 August 2026 he will run as an independent; formal declaration promised for the end of the year."
    options:
      - { run: [bertrand], p: 0.35 }
  - id: villepin
    rationale: "Not formally declared; described as preparing a run and rejecting any primary."
    options:
      - { run: [villepin], p: 0.45 }
