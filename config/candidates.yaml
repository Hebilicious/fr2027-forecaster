# The canonical candidate list and field model. Every source, including the Grok bot, uses these ids.
# Edited through pull requests; the reason for every change goes in research/LOG.md.
#
# Each candidate belongs to exactly one slot. A slot draws at most one option, and an option lists
# the candidates who run together; 1 - sum(p) is the chance nobody from the slot runs.
