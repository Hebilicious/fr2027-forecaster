# Model parameters. Every change here goes through a pull request with the reason in
# research/LOG.md; values marked "provisional" are placeholders until the backtests in
# milestone 3 fit them.

model_version: "0.4.0"
seed: 20270418
simulations: 50000
round1_date: 2027-04-18
round2_date: 2027-05-02

aggregation:
  # Each run picks, by marginal likelihood on the polls it sees, the daily random-walk standard
  # deviation of bloc strengths and within-bloc supports (log scale), the design effect on the
  # multinomial sampling variance, and the share of a scenario's sampling variance that is its
  # own: a poll's scenarios ask the same respondents, so the rest is common to all of them.
  random_walk_sd_grid: [0.002, 0.004, 0.007, 0.012, 0.02, 0.03]
  design_effect_grid: [1.0, 1.5, 2.0, 3.0, 4.0, 6.0]
  scenario_noise_share_grid: [0.1, 0.2, 0.4, 0.6]
  prior_sd: 2.0
  presence_sd: 0.3
  house_sd: 0.08
  share_floor: 0.5
  series_step_days: 3
  series_draws: 300

round1_error:
  # Fat-tailed polling error on each bloc's log strength and each candidate's within-bloc
  # support, fitted by the backtest on the 2002–2022 replays (research/backtest/, research/LOG.md
  # 2026-10-16 and 2026-10-17). 0.18 on a bloc's log strength is about ±4.5 points at 25%.
  # Degrees of freedom: 5 until 0.3.0.
  student_t_df: 3
  bloc_sd: 0.18
  candidate_sd: 0.20
  # Further error per square root of 30 days before round 1, added in variance to the two above:
  # what the campaign still to come can change beyond the polls' own drift. Six months out,
  # 0.20 takes a candidate's error from 0.20 to 0.53. Zero until 0.3.0.
  horizon_bloc_sd: 0.0
  horizon_candidate_sd: 0.20

round2:
  random_walk_sd: 0.01
  design_effect: 1.5
  prior_sd: 1.5
  # Election-day error on the logit of a finalist's share, fitted by the backtest (was 0.08).
  error_sd: 0.12
  # Further error on that logit per square root of 30 days before round 2. Fitted at zero.
  horizon_error_sd: 0.0
  # Tails of the round 2 error, apart from round 1's so that fitting one leaves the other alone.
  # Not fitted: 5 is round 1's value before 0.3.0.
  student_t_df: 5
  transfer_sd: 0.35
  # A matchup no poll has tested is anchored on a tested one with a candidate of the same bloc
  # in place of one finalist, shifted by the gap between the two. Where no poll measured that
  # gap, the candidate tested in more runoff polls is taken to be stronger by 0.11 on the logit
  # scale (about 3 points at 50/50), with a standard deviation of 0.23 (about 6 points): the
  # mean and spread over 46 same-bloc pairs tested against a common opponent in one poll,
  # 2002–2022 (research/LOG.md, 2026-10-17).
  anchor_gap_mean: 0.11
  anchor_gap_sd: 0.23
  loyalty: 0.95
  # Relative propensity of each round 1 bloc's voters to vote for a finalist of each bloc or
  # to abstain / vote blank. For a centre-versus-far-right runoff the rows reproduce the 2022
  # election-day surveys (Ipsos, Ifop, Elabe; see research/LOG.md, 2026-10-09): left voters
  # 45% centre / 15% far right / 40% abstain, right 52/19/29, far right 10/77/13; the `other`
  # row follows Dupont-Aignan's 2022 voters in the pre-runoff polls (Ipsos 11/65/24, Harris
  # 10/63/27). Every other cell is a proximity assumption, outweighed wherever head-to-head
  # polls exist.
  transfers:
    far_left: { far_left: 0.90, left: 0.70, centre: 0.30, right: 0.08, far_right: 0.12, other: 0.20, abstain: 0.58 }
    left: { far_left: 0.60, left: 0.90, centre: 0.45, right: 0.15, far_right: 0.15, other: 0.20, abstain: 0.40 }
    centre: { far_left: 0.15, left: 0.45, centre: 0.97, right: 0.70, far_right: 0.10, other: 0.20, abstain: 0.35 }
    right: { far_left: 0.05, left: 0.20, centre: 0.52, right: 0.95, far_right: 0.19, other: 0.20, abstain: 0.29 }
    far_right: { far_left: 0.08, left: 0.05, centre: 0.10, right: 0.35, far_right: 0.77, other: 0.40, abstain: 0.13 }
    other: { far_left: 0.20, left: 0.20, centre: 0.25, right: 0.35, far_right: 0.40, other: 0.90, abstain: 0.35 }
