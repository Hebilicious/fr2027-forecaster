[package]
name = "fr2027-backtest"
version = "0.1.0"
description = "Replays the model on the 2002–2022 elections, scores it, and fits the election-day error settings."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
csv = "1.4.0"
fr2027-collectors.workspace = true
fr2027-model.workspace = true
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3"
