[project]
name = "fr2027-forecaster"
version = "0.1.0"
description = "Probabilistic forecaster for the 2027 French presidential election"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
  "jsonschema>=4.22",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "feedparser>=6.0",
  "apscheduler>=3.10,<4",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
