[package]
name = "fr2027-cli"
version = "0.1.0"
description = "The fr2027 command: validate, ingest, forecast and serve."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "fr2027"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
fr2027-collectors.workspace = true
fr2027-model.workspace = true
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
hex = "0.4.3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
