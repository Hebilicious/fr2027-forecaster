# Git hooks. Install them once per clone with `moon run repo:hooks-install`; every worktree shares
# them. `lefthook run` would otherwise install them as a side effect.
no_auto_install: true

commit-msg:
  commands:
    semantic:
      run: head -n 1 {1} | scripts/check-semantic.sh
    authorship:
      run: pnpm exec gommage hook --message-file {1}

pre-commit:
  commands:
    format:
      glob: "*.{ts,json,md,yml,yaml}"
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
